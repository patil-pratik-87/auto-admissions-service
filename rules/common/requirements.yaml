dsl_version: "1.3"

module:
  id: ACCESS_REQUIREMENTS
  version: "2025.01-demo.8"

  exports:
    german_qualification:
      fact: qualification.country
      eq: DE

    completed_school_qualification:
      fact: qualification.completed
      eq: true

    validity_restriction_accepted:
      any_of:
        - fact: qualification.validity_restriction_present
          eq: false
        - fact: qualification.validity_restriction_code
          in:
            - ALL_GERMAN_STATES
            - THURINGIA
            - ALL_STATES_EXCEPT_BAVARIA_AND_SAXONY

    complete_general_fhr:
      all_of:
        - fact: qualification.completed
          eq: true
        - fact: qualification.access_scope
          eq: GENERAL
        - fact: qualification.school_part_proven
          eq: true
        - fact: qualification.vocational_part_proven
          eq: true

    completed_advanced_vocational_qualification:
      fact: qualification.completed
      eq: true

    direct_advanced_vocational_level:
      any_of:
        - fact: qualification.dqr_or_eqr_level
          gte: 6
        - all_of:
            - fact: qualification.teaching_hours
              gte: 400
            - fact: qualification.builds_on_completed_training
              eq: true
            - fact: qualification.builds_on_recognized_training
              eq: true

    recognized_vocational_training:
      all_of:
        - fact: candidate.training.completed
          eq: true
        - fact: candidate.training.recognized
          eq: true
        - fact: candidate.training.duration_months
          gte: 24
        - fact: candidate.training.dqr_or_eqr_level
          gte: 4

    vocational_training_requirements_failed:
      any_of:
        - fact: candidate.training.completed
          eq: false
        - fact: candidate.training.recognized
          eq: false
        - fact: candidate.training.duration_months
          lt: 24
        - fact: candidate.training.dqr_or_eqr_level
          lt: 4

    usable_employment_calculation:
      all_of:
        - fact: candidate.all_period_dates_known
          eq: true
        - fact: candidate.all_weekly_hours_known
          eq: true
        - fact: candidate.mini_job_classification_complete
          eq: true
