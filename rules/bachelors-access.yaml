dsl_version: "1.3"

policy:
  id: IU_BACHELOR_ACCESS
  version: "0.0.22"

  applies_when:
    fact: application.study_level
    eq: BACHELOR

  sources:
    - file: ../case-study/IU-FS-LF-Leitfaden-Hochschulzugangsberechtigung-Stand-Januar2025.md
      section: ACCESS TO THE BACHELOR STUDY PROGRAM
      subsections:
        - Studying with the (Fach-) Abitur (general or subject-restricted school-leaving qualification)
        - Studying without the (Fach-)Abitur (general or subject-restricted school-leaving qualification) > Professionally qualified applicants with direct access
        - Studying without the (Fach-)Abitur (general or subject-restricted school-leaving qualification) > Professionally qualified applicants without direct access

  imports:
    - namespace: rule_statuses
      file: rule-statuses.yaml
    - namespace: application_statuses
      file: application-statuses.yaml
    - namespace: requirements
      file: common/requirements.yaml
    - namespace: school
      file: school-access-rules.yaml
    - namespace: professional
      file: professional-access-rules.yaml

  evaluation:
    rule_groups:
      - include: school.WITH_ABITUR_OR_EQUIVALENT_SCHOOL_HZB
      - include: professional.WITHOUT_ABITUR_OR_FACHHOCHSCHULREIFE

  resolution:
    first_match:
      - when_any_rule:
          ref: rule_statuses.ELIGIBLE
        application_status:
          ref: application_statuses.ELIGIBLE
      - when_any_rule:
          ref: rule_statuses.CONDITIONALLY_ELIGIBLE
        application_status:
          ref: application_statuses.CONDITIONALLY_ELIGIBLE
      - when_any_rule:
          ref: rule_statuses.MANUAL_REVIEW
        application_status:
          ref: application_statuses.MANUAL_REVIEW
      - when_any_rule:
          ref: rule_statuses.MISSING_INFORMATION
        application_status:
          ref: application_statuses.MISSING_INFORMATION
      - when_all_applicable_rules:
          ref: rule_statuses.NOT_SATISFIED
        application_status:
          ref: application_statuses.INELIGIBLE
      - when_no_recognized_rule: true
        application_status:
          ref: application_statuses.MANUAL_REVIEW
