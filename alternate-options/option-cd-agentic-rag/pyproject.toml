[project]
name = "admissions-agentic-rag"
version = "0.1.0"
description = "Agentic RAG admissions prototype: compile-once criteria, TOC vs Chroma retrieval arms, evaluator-critic-retry graph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2",
    "pydantic>=2",
    "langgraph>=0.4",
    "langsmith>=0.3",
    "python-dotenv>=1",
    "pandas>=2.2",
    "chromadb>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
