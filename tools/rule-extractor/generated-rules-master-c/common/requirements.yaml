dsl_version: "1.3"

module:
  id: MASTER_ACCESS_REQUIREMENTS
  version: "0.1.0-proposed"

  exports:
    completed_undergraduate_degree:
      fact: candidate.undergraduate.completed
      eq: true

    undergraduate_evidence_complete:
      all_of:
        - fact: candidate.undergraduate.degree_certificate_or_diploma_provided
          eq: true
        - fact: candidate.undergraduate.transcript_provided
          eq: true
        - fact: candidate.undergraduate.completion_grade_and_ects_evident_beyond_doubt
          eq: true

    undergraduate_ects_sufficient:
      any_of:
        - fact: candidate.undergraduate.ects
          gte: 180
        - fact: candidate.undergraduate.full_time_standard_duration_months
          gte: 36

    undergraduate_grade_established:
      all_of:
        - fact: candidate.undergraduate.grade_conversion_established
          eq: true
        - fact: candidate.undergraduate.final_grade_on_german_scale
          gte: 1.0

    undergraduate_grade_meets_minimum:
      all_of:
        - ref: undergraduate_grade_established
        - fact: candidate.undergraduate.final_grade_on_german_scale
          lte: 3.5

    undergraduate_grade_below_minimum:
      all_of:
        - ref: undergraduate_grade_established
        - fact: candidate.undergraduate.final_grade_on_german_scale
          gt: 3.5

    foreign_undergraduate_h_plus_equivalent:
      all_of:
        - fact: candidate.undergraduate.award_location
          eq: FOREIGN
        - fact: candidate.undergraduate.institution_anabin_status
          eq: H_PLUS
        - fact: candidate.undergraduate.qualification_anabin_status
          eq: H_PLUS

    recognized_undergraduate_institution:
      any_of:
        - fact: candidate.undergraduate.award_location
          eq: DOMESTIC
        - ref: foreign_undergraduate_h_plus_equivalent

    foreign_undergraduate_trial_study_decided:
      all_of:
        - fact: candidate.undergraduate.award_location
          eq: FOREIGN
        - fact: candidate.undergraduate.guidelines_management_decision
          eq: TRIAL_STUDY_REQUIRED

    qualifying_undergraduate_degree:
      all_of:
        - ref: completed_undergraduate_degree
        - ref: recognized_undergraduate_institution
        - ref: undergraduate_ects_sufficient
        - ref: undergraduate_evidence_complete

    relevant_dqr7_achievements_sufficient:
      all_of:
        - fact: candidate.additional_achievements.relevance_to_computer_science
          eq: MATCH
        - fact: candidate.additional_achievements.dqr7_or_equivalence_established
          eq: true
        - fact: candidate.additional_achievements.scope_and_level_equivalence_established
          eq: true
        - fact: candidate.additional_achievements.ects_equivalent_total
          gte: 40
        - fact: candidate.additional_achievements.accepted_achievement_type
          in:
            - RELEVANT_MASTER_OR_MBA_DEGREE
            - RELEVANT_MASTER_OR_MBA_STUDY_ACHIEVEMENT
            - RELEVANT_NON_HIGHER_EDUCATION_DQR7_QUALIFICATION

    minimum_grade_or_dqr7_compensation:
      any_of:
        - ref: undergraduate_grade_meets_minimum
        - all_of:
            - ref: undergraduate_grade_below_minimum
            - ref: relevant_dqr7_achievements_sufficient

    english_certificate_meets_listed_threshold:
      any_of:
        - all_of:
            - fact: candidate.english_proof.certificate_type
              eq: TOEFL
            - fact: candidate.english_proof.score
              gte: 80
        - all_of:
            - fact: candidate.english_proof.certificate_type
              eq: IELTS
            - fact: candidate.english_proof.score
              gte: 6.0
        - all_of:
            - fact: candidate.english_proof.certificate_type
              eq: DUOLINGO_ENGLISH_TEST
            - fact: candidate.english_proof.score
              gte: 95
        - all_of:
            - fact: candidate.english_proof.certificate_type
              eq: CAMBRIDGE_CERTIFICATE
            - fact: candidate.english_proof.overall_grade
              eq: B_OR_HIGHER

    non_native_english_requirement_met:
      all_of:
        - fact: candidate.english_proof.cefr_level
          in:
            - B2
            - C1
            - C2
        - ref: english_certificate_meets_listed_threshold
        - fact: candidate.english_proof.certificate_age_years
          lte: 5
        - fact: candidate.english_proof.submission_date
          lt_fact: candidate.program.study_start_date

    english_language_requirement_met:
      any_of:
        - fact: candidate.applicant.english_native_speaker_status
          eq: NATIVE_SPEAKER
        - all_of:
            - fact: candidate.applicant.english_native_speaker_status
              eq: NON_NATIVE_SPEAKER
            - ref: non_native_english_requirement_met

    general_master_admission_requirements:
      all_of:
        - ref: qualifying_undergraduate_degree
        - ref: minimum_grade_or_dqr7_compensation
        - ref: english_language_requirement_met

    computer_science_related_undergraduate_field:
      fact: candidate.undergraduate.relationship_to_computer_science
      eq: MATCH

    different_undergraduate_field:
      fact: candidate.undergraduate.relationship_to_computer_science
      eq: DIFFERENT_SUBJECT

    focus_area_credits_sufficient:
      all_of:
        - fact: candidate.prior_focus_area_coursework.classification_established
          eq: true
        - fact: candidate.prior_focus_area_coursework.ects_total
          gte: 30

    master_entrance_examination_passed:
      all_of:
        - fact: candidate.program.is_consecutive_120_ects_variant
          eq: true
        - fact: candidate.master_entrance_examination.prescribed_courses_defined
          eq: true
        - fact: candidate.master_entrance_examination.subject_specific_courses_passed
          eq: 2
        - fact: candidate.master_entrance_examination.ects_achieved
          eq: 10
        - fact: candidate.master_entrance_examination.passed_within_one_year
          eq: true

    master_entrance_examination_pending:
      all_of:
        - fact: candidate.program.is_consecutive_120_ects_variant
          eq: true
        - fact: candidate.master_entrance_examination.prescribed_courses_defined
          eq: true
        - fact: candidate.master_entrance_examination.status
          in:
            - NOT_STARTED
            - IN_PROGRESS
